[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
# Keep the old deployment routable briefly after the new one becomes healthy,
# then give Pounce longer than its 10-second shutdown timeout before SIGKILL.
overlapSeconds = "5"
drainingSeconds = "15"
