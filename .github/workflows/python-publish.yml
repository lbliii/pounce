# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"

      - name: Assert release tag matches pyproject version
        # A hand-cut GitHub release bypasses `make gh-release`, which derives the
        # tag from pyproject. Fail fast on a mistagged release (issue #167).
        run: |
          PKG_VERSION="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          TAG="${{ github.event.release.tag_name }}"
          echo "pyproject version: ${PKG_VERSION}"
          echo "release tag:       ${TAG}"
          if [ "${TAG}" != "v${PKG_VERSION}" ]; then
            echo "::error::Release tag '${TAG}' does not match pyproject version 'v${PKG_VERSION}'." >&2
            exit 1
          fi

      - name: Build release distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Verify built artifacts (twine check)
        # Catch metadata-broken wheels/sdists before they reach PyPI (issue #167).
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/bengal-pounce

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
