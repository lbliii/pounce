name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format . --check

      - name: Check silent exceptions
        run: bash scripts/check_silent_exceptions.sh src/pounce

      - name: Check raise-message ratchet
        run: uv run python scripts/lint_raise_messages.py

      - name: Check architecture imports
        run: uv run lint-imports --config .importlinter

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: ty check
        run: uv run ty check src/pounce/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14t"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # Include h3 (bengal-zoomies) — zoomies is pure Python, compatible with 3.14t
        run: uv sync --group dev --extra h2 --extra h3 --extra ws --extra tls

      - name: Run tests
        # --timeout/--timeout-method localize a hung socket/drain test to a
        # per-test traceback instead of stalling to the job's timeout-minutes wall.
        run: uv run pytest tests/ -ra -q --maxfail=5 --timeout=60 --timeout-method=thread

      - name: Verify GIL status (free-threaded only)
        if: matrix.python-version == '3.14t'
        run: uv run python -c "import sys; assert not sys._is_gil_enabled(), 'GIL should be disabled on 3.14t'"

  process-workers:
    name: Process Workers (Python 3.14 GIL build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          # Stock 3.14 (GIL enabled) — detect_worker_mode() picks PROCESS/fork,
          # which the 3.14t lanes never exercise (they pick THREAD). This is the
          # production path on stock CPython 3.14.
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --extra h2 --extra h3 --extra ws --extra tls

      - name: Verify GIL is enabled (process/fork path)
        run: uv run python -c "import sys; assert sys._is_gil_enabled(), 'GIL should be enabled on a stock 3.14 build'"

      - name: Run process/fork worker-mode integration tests
        # `-m process` selects the fork-spawn / SIGTERM-reap integration tests
        # (they skip on 3.14t thread mode); this is the production fork path the
        # 3.14t lanes never exercise.
        run: >-
          uv run pytest tests/integration/test_process_workers.py
          -m process -ra -q --timeout=90 --timeout-method=thread

      - name: Run supervisor unit suite
        # Covers spawn/drain/reap branch logic, including the BaseProcess
        # process-vs-thread regression, on the GIL/process path.
        run: uv run pytest tests/unit/test_supervisor.py -ra -q --timeout=90 --timeout-method=thread

  railway-recipe:
    name: Railway Recipe (3.14t container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build Railway image
        working-directory: examples/deploy/railway
        run: docker build --tag pounce-railway-recipe:ci .

      - name: Build Railway main-canary image from this checkout
        run: >-
          docker build
          --file examples/deploy/railway/Dockerfile.canary
          --tag pounce-railway-canary:ci
          .

      - name: Prove GIL-off runtime, readiness, traffic, and SIGTERM exit
        run: |
          set -euo pipefail
          docker run --detach --name pounce-railway-ci \
            --env PORT=8000 \
            --publish 127.0.0.1:18080:8000 \
            pounce-railway-recipe:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs pounce-railway-ci
              exit 1
            fi
            sleep 1
          done

          body=$(curl --fail --silent http://127.0.0.1:18080/)
          printf '%s' "$body" | grep --fixed-strings '"status":"ok"'
          printf '%s' "$body" | grep --fixed-strings '"gil_enabled":false'
          docker exec pounce-railway-ci \
            /opt/venv/bin/python -c "import sys; assert not sys._is_gil_enabled()"

          docker stop --time 20 pounce-railway-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' pounce-railway-ci)" = "0"

          docker run --detach --name pounce-railway-canary-ci \
            --env PORT=8000 \
            --env POUNCE_DEPLOYMENT_CHANNEL=main-canary \
            --env RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" \
            --publish 127.0.0.1:18081:8000 \
            pounce-railway-canary:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs pounce-railway-canary-ci
              exit 1
            fi
            sleep 1
          done

          canary_body=$(curl --fail --silent http://127.0.0.1:18081/)
          printf '%s' "$canary_body" | grep --fixed-strings '"channel":"main-canary"'
          printf '%s' "$canary_body" | grep --fixed-strings "\"git_commit\":\"$GITHUB_SHA\""
          stream_body=$(curl --fail --silent http://127.0.0.1:18081/stream)
          test "$(printf '%s' "$stream_body" | grep --count 'event: canary')" = "2"

          docker stop --time 20 pounce-railway-canary-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' pounce-railway-canary-ci)" = "0"

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs pounce-railway-ci || true
          docker rm --force pounce-railway-ci || true
          docker logs pounce-railway-canary-ci || true
          docker rm --force pounce-railway-canary-ci || true

  framework-compat:
    name: Framework Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --group test-frameworks --extra h2 --extra ws --extra tls

      - name: Run framework tests
        run: uv run pytest tests/integration/frameworks/ -ra -q --maxfail=5 --timeout=60 --timeout-method=thread

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --extra h2 --extra h3 --extra ws --extra tls

      - name: Run tests with coverage
        # ADVISORY (continue-on-error) until CI TOTAL reaches the pyproject
        # [tool.coverage.report] fail_under=80 floor. Readiness gate (issue #165):
        # flip continue-on-error to false ONLY once the 3.14t lane reports
        # TOTAL >= 80%, so a PR that drops a hot-path module below the floor
        # fails CI. Do NOT flip it before then or this lane reds the board.
        #
        # Progress: ~68% when this lane was added -> ~71% after the #165
        # groundwork (async_pool, net/listener, config unit tests). The
        # remaining gap is concentrated in modules whose uncovered branches need
        # live-socket / free-threaded / multi-worker / H2 / H3 runtime that pure
        # unit tests cannot reach (server, worker, supervisor, sync_worker,
        # h3_worker, _h2_handler). Those close as the 0.8.1/0.8.2 test additions
        # (runtime/integration coverage) merge; re-measure here, then flip.
        continue-on-error: true
        run: >-
          uv run pytest tests/
          --cov=pounce --cov-report=term-missing --cov-report=xml
          --timeout=60 --timeout-method=thread

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
