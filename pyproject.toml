[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bengal-pounce"
version = "0.8.0"
description = "Python ASGI server for production apps, streaming responses, and free-threaded Python"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Bengal Contributors", email = "lbeezr@icloud.com" }]
keywords = [
    "asgi",
    "asgi-server",
    "python-asgi-server",
    "server",
    "http",
    "uvicorn-alternative",
    "streaming",
    "production",
    "free-threading",
    "nogil",
    "websocket",
    "http2",
    "http3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "h11>=0.16.0",      # HTTP/1.1 parser (pure Python, well-tested, ~2k LOC)
    "milo-cli>=0.2.2",  # CLI framework (type-driven parsing, MCP, llms.txt)
]

[project.optional-dependencies]
# HTTP/2 support
h2 = ["h2>=4.3.0"]

# WebSocket support
ws = ["wsproto>=1.3.2"]

# TLS termination
tls = ["truststore>=0.10.4"]

# HTTP/3 support (QUIC)
h3 = ["bengal-zoomies>=0.3.1"]

# Chirp web framework integration (example/compat tests)
chirp = ["bengal-chirp>=0.7.1"]

# Full protocol support
full = [
    "h2>=4.3.0",
    "wsproto>=1.3.2",
    "truststore>=0.10.4",
    "bengal-zoomies>=0.3.1",
    "bengal-chirp>=0.7.1",
]

[project.scripts]
pounce = "pounce._cli:main"

[project.entry-points."pytest11"]
pounce = "pounce.testing"

[project.urls]
Homepage = "https://lbliii.github.io/pounce/"
Documentation = "https://lbliii.github.io/pounce/"
Repository = "https://github.com/lbliii/pounce"
Changelog = "https://github.com/lbliii/pounce/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pounce = ["py.typed", "templates/*.kida", "templates/components/*.kida"]

# =============================================================================
# Ruff — Linter & Formatter
# =============================================================================
# Matches bengal/chirp/kida/patitas/rosettes rule set
# Line length: 100 (consistent across all projects)
# Target: Python 3.14 (free-threading)

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, variables, etc.)
    "UP",   # pyupgrade — Python modernization
    "B",    # flake8-bugbear — common bugs and design problems
    "SIM",  # flake8-simplify — simplify code
    "I",    # isort — import sorting
    "N",    # pep8-naming — naming conventions
    "PIE",  # misc lints (unnecessary pass, duplicate dict keys, etc.)
    "PERF", # perflint — performance anti-patterns
    "C4",   # unnecessary comprehensions/list()/dict() calls
    "RUF",  # Ruff-specific (unused noqa, mutable class defaults, etc.)
    "PT",   # flake8-pytest-style — pytest best practices
    "S",    # flake8-bandit — security checks (hardcoded secrets, subprocess shells)
    "A",    # flake8-builtins — prevent shadowing builtins
    "T20",  # flake8-print — catch stray print() calls (server should log)
    "DTZ",  # flake8-datetimez — enforce timezone-aware datetimes
    "FBT",  # flake8-boolean-trap — boolean positional args
]
ignore = [
    "E501",   # line too long — handled by formatter
    "S101",   # assert — handled per-file below
    "FBT001", # boolean positional arg in function definition — too noisy for config
    "FBT002", # boolean default value in function definition — too noisy for config
    "FBT003", # boolean positional value in function call — too noisy
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]                           # Allow unused imports in __init__ files (re-exports)
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607"]  # Allow assert, 0.0.0.0, passwords, tmpfiles, subprocess
"examples/**/*.py" = ["T20", "S104", "S110"]                       # Allow print(), 0.0.0.0, and try-except-pass in examples
"benchmarks/**/*.py" = ["T20", "S101", "S603", "S607"]            # Allow print(), assert, subprocess in benchmarks
"src/pounce/_cli.py" = ["S603", "S607", "T20"]     # Subprocess calls for port diagnostics; print() for user-facing CLI output
"src/pounce/_bench.py" = ["T20", "S110", "S603", "S607"]  # Print output, try-except-pass, subprocess for benchmarks

# =============================================================================
# ty — Type Checker (Rust-based, Astral)
# =============================================================================
# Strict by default. pounce targets no new type suppressions without review.

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["dist/", "build/", "tests/"]

[tool.ty.analysis]
# Optional deps that may not be installed in all environments
allowed-unresolved-imports = ["rosettes", "zoomies", "zoomies.**", "bengal-zoomies", "uvicorn", "truststore"]

[tool.ty.rules]
unused-ignore-comment = "warn"
invalid-return-type = "error"
missing-argument = "error"
invalid-argument-type = "error"

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_functions = ["test_*"]
# --timeout/--timeout-method localize a hung socket/drain test to a per-test
# traceback instead of stalling the whole job to the CI wall clock. 60s sits
# above the slowest legitimate integration test; benchmarks are excluded here
# (-m "not benchmark") so the bound never trips a long-running benchmark.
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "-m",
    "not benchmark",
    "--timeout=60",
    "--timeout-method=thread",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: full server integration tests",
    "benchmark: performance benchmarks",
    "timeout: per-test timeout (requires pytest-timeout)",
    "process: process/fork worker-mode tests (GIL build only)",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["src/pounce"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "def __repr__",
]

# =============================================================================
# Development Dependencies (PEP 735 — install with: uv sync --group dev)
# =============================================================================

[dependency-groups]
docs = [
    "bengal>=0.2.6", # Static site generator for documentation
    "lunr>=0.8.0",   # Pre-built search index
]
test-frameworks = [
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "litestar>=2.0",
    "django>=5.0",
    "httpx>=0.28.1",
]
dev = [
    # Testing
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.2.3",
    "hypothesis>=6.151.10",
    # Type Checking
    "ty>=0.0.28",
    # Linting & Formatting
    "ruff>=0.15.9",
    # Changelog
    "towncrier>=24.0",
    # Pre-commit
    "pre-commit>=4.5.1",
    # Protocol deps for full test suite
    "h2>=4.3.0",
    "wsproto>=1.3.2",
    # Chirp framework — so example/compat tests run instead of skipping (#150)
    "bengal-chirp>=0.7.1",
    # Optional deps for ty resolution (unresolved-import)
    "bengal-zoomies>=0.3.1",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "sentry-sdk>=2.57.0",
    # CLI framework
    "milo-cli>=0.2.2",
    # Test utilities
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
]

# =============================================================================
# Task Runner (poethepoet) — use: poe <task>
# =============================================================================

[tool.poe.tasks]
# Testing
test = { cmd = "pytest", help = "Run full test suite" }
test-fast = { cmd = "pytest tests/ -x -q --timeout=10", help = "Fast feedback loop" }
test-cov = { cmd = "pytest tests/ --cov=pounce --cov-report=term-missing", help = "Run tests with coverage" }
bench = { cmd = "pytest benchmarks/ -m benchmark --benchmark-only", help = "Run benchmarks" }
examples = { cmd = "pytest tests/integration/test_examples.py -v", help = "Smoke-test examples" }

# Type Checking
ty = { cmd = "ty check src/pounce/", help = "Run ty type checker" }
ty-strict = { cmd = "ty check src/pounce/ --error-on-warning", help = "Strict type checking" }

# Linting & Formatting
lint = { cmd = "ruff check .", help = "Run ruff linter" }
lint-fix = { cmd = "ruff check . --fix", help = "Run ruff linter with auto-fix" }
format = { cmd = "ruff format .", help = "Format code with ruff" }
format-check = { cmd = "ruff format . --check", help = "Check formatting" }

# CI Pipeline
ci = { sequence = [
    "lint",
    "format-check",
    "ty",
    "test",
], help = "Full CI check" }
check = { sequence = [
    "lint",
    "format-check",
    "ty",
], help = "Quick check (no tests)" }

# Changelog
changelog = { cmd = "towncrier build --yes", help = "Compile changelog.d fragments into CHANGELOG.md" }
changelog-draft = { cmd = "towncrier build --draft", help = "Preview changelog from fragments (stdout)" }
changelog-check = { cmd = "towncrier check --compare-with origin/main", help = "Verify branch adds a fragment (vs main)" }

# Build & Release
dist = { shell = "rm -rf dist/ && uv build && ls -la dist/", help = "Build distribution" }

# Cleanup
clean.shell = """
rm -rf dist build .pytest_cache .coverage htmlcov .ruff_cache .ty_cache
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
"""
clean.help = "Remove build artifacts and caches"

# =============================================================================
# Towncrier — Changelog Fragments
# =============================================================================
# Fragment convention: changelog.d/<+slug>.<type>.md
# Compile with: poe changelog (or towncrier build --yes)
# Preview with: poe changelog-draft

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
package = "bengal-pounce"
package_dir = "src"
title_format = "## [{version}] — {project_date}"
issue_format = "[#{issue}](https://github.com/lbliii/pounce/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
