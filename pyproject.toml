[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bengal-pounce"
version = "0.2.2"
description = "Python ASGI server for production apps, streaming responses, and free-threaded Python"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Bengal Contributors", email = "lbeezr@icloud.com" }]
keywords = [
    "asgi",
    "asgi-server",
    "python-asgi-server",
    "server",
    "http",
    "uvicorn-alternative",
    "streaming",
    "production",
    "free-threading",
    "nogil",
    "websocket",
    "http2",
    "http3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "h11>=0.14.0",  # HTTP/1.1 parser (pure Python, well-tested, ~2k LOC)
]

[project.optional-dependencies]
# HTTP/2 support
h2 = ["h2>=4.0"]

# WebSocket support
ws = ["wsproto>=1.2"]

# TLS termination
tls = ["truststore>=0.9"]

# HTTP/3 support (QUIC)
h3 = ["bengal-zoomies>=0.1.1"]

# Full protocol support
full = ["h2>=4.0", "wsproto>=1.2", "truststore>=0.9", "bengal-zoomies>=0.1.1"]

[project.scripts]
pounce = "pounce._cli:main"

[project.urls]
Homepage = "https://lbliii.github.io/pounce/"
Documentation = "https://lbliii.github.io/pounce/"
Repository = "https://github.com/lbliii/pounce"
Changelog = "https://github.com/lbliii/pounce/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pounce = ["py.typed"]

# =============================================================================
# Ruff — Linter & Formatter
# =============================================================================
# Matches bengal/chirp/kida/patitas/rosettes rule set
# Line length: 100 (consistent across all projects)
# Target: Python 3.14 (free-threading)

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, variables, etc.)
    "UP",   # pyupgrade — Python modernization
    "B",    # flake8-bugbear — common bugs and design problems
    "SIM",  # flake8-simplify — simplify code
    "I",    # isort — import sorting
    "N",    # pep8-naming — naming conventions
    "PIE",  # misc lints (unnecessary pass, duplicate dict keys, etc.)
    "PERF", # perflint — performance anti-patterns
    "C4",   # unnecessary comprehensions/list()/dict() calls
    "RUF",  # Ruff-specific (unused noqa, mutable class defaults, etc.)
    "PT",   # flake8-pytest-style — pytest best practices
]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # Allow unused imports in __init__ files (re-exports)
"tests/**/*.py" = ["S101"] # Allow assert in tests

# =============================================================================
# ty — Type Checker (Rust-based, Astral)
# =============================================================================
# Strict by default. pounce targets zero type: ignore comments.

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["dist/", "build/", "tests/"]

[tool.ty.analysis]
# Optional deps that may not be installed in all environments
allowed-unresolved-imports = ["rosettes", "zoomies", "zoomies.**", "bengal-zoomies"]

[tool.ty.rules]
unused-ignore-comment = "warn"

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "-q", "--strict-markers", "-m", "not benchmark"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: full server integration tests",
    "benchmark: performance benchmarks",
    "timeout: per-test timeout (requires pytest-timeout)",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["src/pounce"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "def __repr__",
]

# =============================================================================
# Development Dependencies (PEP 735 — install with: uv sync --group dev)
# =============================================================================

[dependency-groups]
docs = [
    "bengal>=0.2.0", # Static site generator for documentation
    "lunr>=0.7.0",   # Pre-built search index
]
dev = [
    # Testing
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=5.0.0",
    "hypothesis>=6.100.0",
    # Type Checking
    "ty>=0.0.11",
    # Linting & Formatting
    "ruff>=0.14.0",
    # Pre-commit
    "pre-commit>=4.0.0",
    # Protocol deps for full test suite
    "h2>=4.0",
    "wsproto>=1.2",
    # Optional deps for ty resolution (unresolved-import)
    "bengal-zoomies>=0.1.1",
    "opentelemetry-api>=1.0",
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0",
    "sentry-sdk>=2.0",
    # Test utilities
    "httpx>=0.27.0",
]

# =============================================================================
# Task Runner (poethepoet) — use: poe <task>
# =============================================================================

[tool.poe.tasks]
# Testing
test = { cmd = "pytest", help = "Run full test suite" }
test-fast = { cmd = "pytest tests/ -x -q --timeout=10", help = "Fast feedback loop" }
test-cov = { cmd = "pytest tests/ --cov=pounce --cov-report=term-missing", help = "Run tests with coverage" }
bench = { cmd = "pytest tests/ -m benchmark --benchmark-only", help = "Run benchmarks" }
examples = { cmd = "pytest tests/integration/test_examples.py -v", help = "Smoke-test examples" }

# Type Checking
ty = { cmd = "ty check src/pounce/", help = "Run ty type checker" }
ty-strict = { cmd = "ty check src/pounce/ --error-on-warning", help = "Strict type checking" }

# Linting & Formatting
lint = { cmd = "ruff check .", help = "Run ruff linter" }
lint-fix = { cmd = "ruff check . --fix", help = "Run ruff linter with auto-fix" }
format = { cmd = "ruff format .", help = "Format code with ruff" }
format-check = { cmd = "ruff format . --check", help = "Check formatting" }

# CI Pipeline
ci = { sequence = [
    "lint",
    "format-check",
    "ty",
    "test",
], help = "Full CI check" }
check = { sequence = [
    "lint",
    "format-check",
    "ty",
], help = "Quick check (no tests)" }

# Build & Release
dist = { shell = "rm -rf dist/ && uv build && ls -la dist/", help = "Build distribution" }

# Cleanup
clean.shell = """
rm -rf dist build .pytest_cache .coverage htmlcov .ruff_cache .ty_cache
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
"""
clean.help = "Remove build artifacts and caches"
